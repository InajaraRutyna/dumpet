 const found=[];const disc=k=>{if(!S.rules[k]){S.rules[k]=1;found.push(k)}};
 disc("MAIN");disc("PLACE");f.ops.forEach(disc);if(f.subAdv)disc("SAV");if(f.front)disc("V2");if(f.ops.length>1)disc("CHAIN");
 let heal=0;if(f.front&&has("inv")){heal=5;S.hp=Math.min(maxHp(),S.hp+5)}
 S.xp+=found.length*10;save();
 B.line=B.hp<=0?"…":rnd(["Av!","Det var … rigtig grammatik.","Ikke dårligt, fremmed."]);
 ui(head()+`<div class="fb pop"><b>${dmg} damage</b><span>${esc(text)}</span><span class="formula">${parts.join(" ")} = ${dmg}</span>${heal?`<span class="dim">Inverter: +5 ♥</span>`:""}${found.map(k=>`<span><span style="color:var(--gold)">Rule discovered: ${RULES[k][0]}</span><br><span class="dim">${RULES[k][1]} · +10 xp</span></span>`).join("")}<button class="go" id="nx">${B.hp<=0?"Finish it":"Their turn"}</button></div>`);
 $("#nx").onclick=()=>B.hp<=0?(B.f.boss&&!B.final?finisher():win()):enemyTurn();
}
function finisher(){
 ui(head()+`<p class="lab">${B.f.n} · the last word</p><h2>Hvorfor kom du hertil?</h2><p class="dim">He is on one knee, and still asking. Write your answer from memory: one sentence with at least two operators, or a fordi-clause containing an adverb.</p><input type="text" id="fw" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Jeg kom hertil …"><button class="go" id="ck">Answer him</button><div id="out"></div>`);
 $("#ck").onclick=()=>{const v=$("#fw").value;if(!v.trim())return;const t=tokenize(v);let err=t.err,r;
  if(!err){r=parse(t.ids.map(id=>RUNES[id].t));if(!r.ok)err=r.err;else if(!(r.f.ops.length>=2||(r.f.ops.includes("FORDI")&&r.f.subAdv)))err="Grammatical, but too thin a reason. Two operators, or a fordi-clause with an adverb (ikke, gerne, altid)."}
  if(err){S.hp-=4;W.fx.hurt=1;save();$("#out").innerHTML=`<div class="fb no pop"><b>He shakes his head. −4 ♥</b><span class="dim">${esc(err)}</span></div>`;if(S.hp<=0)setTimeout(()=>scene("frog"),1200);return}
  B.final=true;W.fx.beam=1;
  $("#out").innerHTML=`<div class="fb pop"><b>He lowers the spear.</b><span>${esc(pretty(t.ids))}</span><span class="dk"><b>Grumme</b>${fog("Det er en god grund. Velkommen til Tågeby.")}</span><button class="go" id="nx">Continue</button></div>`;$("#nx").onclick=win};
}
function win(){
 const f=B.f,o=B.opt,xp=Math.round(f.xp*(o.xpMul||1));S.xp+=xp;S.cr+=f.cr;let extra="";
 if(o.hunt){S.hunts++;if(S.hunts===1){gain(["igar","inat"]);extra+=`<p class="dk"><b>Mumle</b>${fog("Husk: først tid, så verbet!")}</p><p class="dim">New runes: i går, i nat. They go at the FRONT of a sentence. See what that does to the word order.</p>`}
  else if(S.hunts===2){gain(["boe","vi","try"]);extra+=`<p class="dim">New runes: boede, vi, trylle.</p>`}}
 let up="";while(S.xp>=40*S.lvl){S.xp-=40*S.lvl;S.lvl++;S.hp=maxHp();up=`<p class="big" style="color:var(--gold)">Level ${S.lvl}. +5 max ♥, fully healed.</p>`}
 save();
 ui(`<p class="lab">Victory</p><h2>${f.n} is gone</h2><p>+${xp} xp · +${f.cr} ◆</p>${up}${extra}<button class="go" id="nx">Continue</button>`);
 $("#nx").onclick=()=>{W.foe=null;o.after?scene(o.after):closeSheet()};
}
function enemyTurn(){
 if(B.cd>0)B.cd--;
 const f=B.f,n=f.boss&&B.hp<B.max/2?2:1;let k=0;const pool=shuffle(PARRY);
 const one=async()=>{
  const it=pool[k],secs=(f.boss?9:11)-(S.sig.includes("glass")?2:0);
  const r=await parry(it,secs,n>1?`Attack ${k+1} of ${n}`:"Parry");
  const dmg=f.dmg+(B.opt.dmgAdd||0);let hd,cls="";
  if(r.perfect){const c=5+3*S.lvl;B.hp-=c;W.fx.beam=.7;S.hp=Math.min(maxHp(),S.hp+2);hd=`Perfect parry. Counter for ${c}, +2 ♥`}
  else if(r.ok)hd="Parried.";
  else{S.hp-=dmg;W.fx.hurt=1;hd=(r.late?"Too slow. ":"Wrong. ")+`You take ${dmg}.`;cls="no"}
  // hearing a line in a fight teaches its words
  const full=it.d.replace("___",it.o[0]);if(r.ok)norm(full).split(" ").forEach(w=>{if(GLOSS[w]&&!knows(w))S.known.push(w)});
  save();B.line=full;
  ui(head()+`<div class="fb ${cls} pop"><b>${hd}</b><span>${esc(full)}</span>${it.sp?`<span class="dim">${esc(it.o[0])}</span>`:""}<button class="go" id="nx">Continue</button></div>`);
  $("#nx").onclick=()=>{if(S.hp<=0){W.foe=null;return scene("frog")}if(B.hp<=0)return B.f.boss&&!B.final?finisher():win();k++;if(k<n)one();else{newHand();drawBattle()}};
 };
 one();
}
// Timed parry: three answers at ← ↑ →. Tilt the phone, swipe, or tap.
function parry(it,secs,label){return new Promise(res=>{
 const order=shuffle([0,1,2]),pos=["U","L","R"],t0=performance.now();let done=false,base=null,raf;
 ui(`<p class="lab">${label} · ${B.f.n} attacks</p><div class="meter time"><i id="tm" style="width:100%"></i></div><p class="big">${it.sp?fog(it.d):esc(it.d)}</p><p class="dim">${it.sp?"Listen. What did they say?":"Fill the gap."} ${S.motion?"Tilt, swipe or tap.":"Swipe or tap."}</p>
 <div class="parry">${order.map((oi,p)=>`<button class="${pos[p]}" data-p="${pos[p]}" data-o="${oi}">${esc(it.o[oi])}</button>`).join("")}</div>`);
 if(it.sp)speak(it.d,1);
 const fin=(oi,late)=>{if(done)return;done=true;cancelAnimationFrame(raf);removeEventListener("deviceorientation",ori);document.removeEventListener("touchstart",ts);document.removeEventListener("touchend",te);
  const el=(performance.now()-t0)/1000;res({ok:oi===0,perfect:oi===0&&el<secs*.45,late})};
 const pick=p=>{const b=app.querySelector(`[data-p="${p}"]`);if(b)fin(+b.dataset.o)};
 app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>fin(+b.dataset.o));
 const tick=()=>{const el=(performance.now()-t0)/1000,t=$("#tm");if(t)t.style.width=Math.max(0,100*(1-el/secs))+"%";if(el>=secs)return fin(-1,true);raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);
 function ori(e){if(!S.motion||e.gamma==null)return;if(!base){base={g:e.gamma,b:e.beta};return}if(performance.now()-t0<500)return;const dg=e.gamma-base.g,db=e.beta-base.b;if(dg<-20)pick("L");else if(dg>20)pick("R");else if(db<-20)pick("U")}
 addEventListener("deviceorientation",ori);
 let sx0,sy0;function ts(e){sx0=e.touches[0].clientX;sy0=e.touches[0].clientY}
 function te(e){if(sx0==null)return;const dx=e.changedTouches[0].clientX-sx0,dy=e.changedTouches[0].clientY-sy0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))pick(dx<0?"L":"R");else if(dy<-60)pick("U")}
 document.addEventListener("touchstart",ts,{passive:true});document.addEventListener("touchend",te,{passive:true});
})}

// ============================================================ BOOT
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
window.RUNES=RUNES;window.G={get S(){return S},get B(){return B},W,parse,tokenize,scene,closeSheet,sheetOpen};
W.cam=W.px-VW/2;
requestAnimationFrame(frame);
if(!S.flags.landed)scene("p1");
</script>
