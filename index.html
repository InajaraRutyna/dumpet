const BASE="i og er du jeg min ja nej hej tak okay en et det ha kra mumle tågeby stop".split(" ");   // survival words you arrive with
const START=["hej","ja","nej","tak","jeg","du","er","okay"];
// word-lights: [x, height above ground, word]
const FAIRY=[[610,40,"våd"],[760,48,"sø"],[880,112,"måne"],[1250,118,"rumskib"],[1960,44,"mørk"],[2230,110,"lygte"],[2560,46,"skov"],[2880,46,"fremmed"],[2950,84,"hvorfor"],[3030,120,"hertil"],[3900,46,"grund"],[4100,112,"bro"],[4200,48,"trold"],[5450,46,"mose"],[5600,112,"tåge"],[5760,46,"vej"],[6300,48,"sove"],[7150,46,"marked"],[7230,112,"købe"],[7300,46,"brød"],[7360,110,"spise"],[7700,46,"se"],[8200,46,"seng"],[8300,112,"træt"],[9000,46,"sol"],[9160,46,"frø"]];
const NAMES={m:"Mumle",r:"Ravnen",t:"Trolden",l:"Lygten",k:"Mosekonen",b:"Bagerkonen",y:"Lygtemanden",i:"Kromutter",f:"Frøen",g:"Grumme",c:"Barnet"};
const VOICE={m:[1,1.05],r:[1.08,1.15],t:[.8,.6],l:[1,1],k:[.88,.9],b:[1,1.05],y:[.85,.8],i:[.97,1],f:[1.05,.85],g:[.9,.7],c:[1.05,1.25]};   // [speed, pitch] relative to the player's voice settings

const $=s=>document.querySelector(s),app=$("#app"),tip=$("#tip"),cv=$("#cv"),ctx=cv.getContext("2d");

const save=()=>{try{S.px=Math.round(W.px);localStorage.setItem("dumpet-f1",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[.,!?;:"'’…()–-]/g," ").replace(/\s+/g," ").trim();
const knows=w=>BASE.includes(w)||S.chips.includes(w)||S.peek.includes(w)||w===S.name.toLowerCase();
// Danish as you perceive it: words you haven't met are dimmed. Tap any word for its meaning.
const fog=s=>esc(s).split(/([A-Za-zÆØÅæøåé]+)/).map((x,i)=>{if(i%2===0)return x;const l=x.toLowerCase();if(!GLOSS[l])return x;return `<span class="${knows(l)?"w":"fg"}" data-w="${l}">${x}</span>`}).join("");
let tipT;const toast=(t,ms)=>{tip.textContent=t;tip.hidden=false;clearTimeout(tipT);tipT=setTimeout(()=>tip.hidden=true,ms||2600)};
document.addEventListener("click",e=>{audioStart();const w=e.target.closest("[data-w]");if(w){const k=w.dataset.w;toast(w.textContent+" = "+GLOSS[k]);if(w.classList.contains("fg")){w.className="w";if(!S.peek.includes(k))S.peek.push(k)}return}const s=e.target.closest("[data-say]");if(s)speak(s.dataset.say,s.dataset.who)});
const daVoices=()=>{try{return speechSynthesis.getVoices().filter(x=>/^da/i.test(x.lang))}catch(e){return []}};
function speak(t,who){try{const v=VOICE[who]||[1,1],u=new SpeechSynthesisUtterance(t);u.lang="da-DK";u.rate=Math.max(.5,Math.min(1.6,S.vr*v[0]));u.pitch=Math.max(.1,Math.min(2,S.vp*v[1]));const vs=daVoices(),dv=vs.find(x=>x.name===S.vn)||vs.find(x=>/(^|[^e])male|jeppe|magnus|mand/i.test(x.name))||vs[0];if(dv)u.voice=dv;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.getVoices()}catch(e){}

function audioTick(t){
 if(!A.c)return;const now=A.c.currentTime,set=(p,v)=>p.setTargetAtTime(S.sound?v:0,now,.6),px=W.px;

 if(t>A.ch){A.ch=t+13;const ch=CHORDS[Math.floor(t/13)%4];A.osc.forEach((o,i)=>o.frequency.setTargetAtTime(ch[i],now,2))}
 if(t>A.nb){A.nb=t+2.5+Math.random()*4;tone(BELL[Math.floor(Math.random()*BELL.length)]*(forest?.5:1),2.8,.035,"sine")}
 if(forest&&t>A.nk){A.nk=t+.28+Math.random()*.5;if(Math.random()<.6)tone(4100+Math.random()*500,.05,.008,"sine")}
 if(forest&&t>A.no){A.no=t+11+Math.random()*10;tone(370,.5,.03,"sine");tone(311,.7,.03,"sine",.6)}
 if(t>A.nc&&Math.abs(px-3080)<420){A.nc=t+7+Math.random()*8;sfx.caw()}

  if(px>5350&&px<7000)tone(80+Math.random()*40,.16,.035,"sine",0,170);                                   // bog bubbles
  else if(px>7000&&px<8800&&!S.dawn)tone(BELL[Math.floor(Math.random()*7)]*2,.9,.02,"triangle");            // market chimes
  else if(px>8800&&px<10950){if(Math.random()<.6){const f=2300+Math.random()*900;tone(f,.07,.02,"sine",0,f*1.3);tone(f*1.1,.07,.02,"sine",.11,f*1.4)}   // dawn birds

 <p class="lab">Danish voices on this phone · ${vs.length}</p><div class="opts">${vs.map((v,i)=>`<button data-v="${i}">${esc(v.name)}<small>${v.name===S.vn||(!S.vn&&i===0)?"In use":"Tap to use"}</small></button>`).join("")||`<p class="dim">No Danish voice found. Install one in your phone's settings: System → Languages → Text-to-speech output → install voice data → Danish.</p>`}</div>
 <button class="go" id="bk">Back</button>`,true);
 $("#vp").oninput=e=>{S.vp=+e.target.value;save()};$("#vr").oninput=e=>{S.vr=+e.target.value;save()};
 $("#t1").onclick=()=>speak(test);$("#t2").onclick=()=>speak(test,"t");$("#t3").onclick=()=>speak("Kom, vi går til Tågeby.","m");
 mp.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.vn=vs[+b.dataset.v].name;save();voice();speak(test)});$("#bk").onclick=menu}
function backup(){let code="";try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){}
 uiM(`<p class="lab">Settings</p><h1>Your progress</h1><p class="dim">The game saves by itself after every step, on this phone, in this browser. You can close it at any time and carry on later.</p>
 <p class="lab">Backup code</p><p class="dim">Copy this code somewhere safe to keep a copy of your progress, or to move it to another phone.</p><textarea id="bc" rows="4" readonly style="width:100%;font:.7rem monospace;background:#120e26;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;user-select:text;-webkit-user-select:text">${code}</textarea><button id="cp">Copy the code</button>
 <p class="lab">Restore</p><textarea id="rc" rows="3" placeholder="Paste a backup code here" style="width:100%;font:.7rem monospace;background:#120e26;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;user-select:text;-webkit-user-select:text"></textarea><button id="rl">Load this code</button>
 <p class="lab">Start again</p><button id="rs" class="ghost">Restart the story from the beginning</button>
 <button class="go" id="bk">Back</button>`,true);
 $("#cp").onclick=()=>{const t=$("#bc");t.select();(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast("Copied")).catch(()=>toast("Select the code and copy it by hand"))};
 $("#rl").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#rc").value.trim()))));if(!o||o.v!==1)throw 0;localStorage.setItem("dumpet-f1",JSON.stringify(o));location.reload()}catch(e){toast("That code doesn't work. Check that you pasted all of it.",3500)}};
 let arm=false;$("#rs").onclick=e=>{if(!arm){arm=true;e.target.textContent="Tap again: this erases your words and progress";return}const keep={v:1,vp:S.vp,vr:S.vr,vn:S.vn,sound:S.sound,tilt:S.tilt};try{localStorage.setItem("dumpet-f1",JSON.stringify(keep))}catch(x){}location.reload()};
 $("#bk").onclick=menu}
function travel(i){const p=PLACES[i];S.beat=p.beat;W.px=p.px;W.mx=null;W.cam=W.px-VW/2;if(p.beat<=6)S.lit=0;if(p.beat<=9)S.stones=0;if(p.beat<=12)S.fogClear=0;if(p.beat<=17)S.dawn=0;if(p.beat<=20)S.gate=0;W.mumAway=0;W.bell=null;save();closeM();hud();toast(p.n,1800)}
function menu(){
 uiM(`<p class="lab">Dumpet på Måne Syv</p><h1>Menu</h1><p class="dim">Forstand ${Math.round(S.fors)}/100 · Tillid: ${Object.keys(S.til).filter(k=>S.til[k]).map(k=>NAMES[k]+" "+S.til[k]).join(" · ")||"none yet"}</p>
 <button class="go" id="bk">Continue</button>
 <p class="lab">Chapter 1 · places</p><div class="opts">${PLACES.map((p,i)=>`<button data-p="${i}" ${S.top<p.beat||W.busy?"disabled":""}>${p.n}<small>${S.top<p.beat?"Not reached yet":W.busy?p.en+" · finish this conversation first":p.en+" · play from here"}</small></button>`).join("")}</div>
 <p class="lab">Chapter 2</p><div class="opts"><button disabled>Not written yet<small>Opens with your next chapter</small></button></div>
 <p class="lab">Study</p><div class="opts"><button id="nb">Notesbog<small>The grammar you have worked out, with examples</small></button><button id="ob">Ordbog<small>Your ${S.chips.length} words</small></button></div>
 <p class="lab">Settings</p><div class="opts"><button id="vo">Voice<small>Deeper, slower, or a different voice</small></button><button id="pr">People call you: ${S.pro}<small>Tap to switch between hun (she) and han (he)</small></button><button id="snd">Sound and music: ${S.sound?"on":"off"}</button><button id="tlt">Tilt the phone to walk: ${S.tilt?"on":"off"}</button><button id="sv">Your progress<small>Saved automatically · backup · restart</small></button></div>`,true);
 $("#bk").onclick=closeM;$("#nb").onclick=notes;$("#ob").onclick=words;$("#vo").onclick=voice;$("#sv").onclick=backup;
 $("#pr").onclick=()=>{S.pro=S.pro==="han"?"hun":"han";save();menu()};$("#snd").onclick=()=>{S.sound=S.sound?0:1;save();audioStart();menu()};$("#tlt").onclick=()=>{S.tilt=S.tilt?0:1;save();menu()};
 mp.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>travel(+b.dataset.p));
}
$("#menu").onclick=()=>{if(!mp.hidden)return closeM();if(S.landed)menu()};

// ---------- BOOT ----------
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
window.G={get S(){return S},W,sheetOpen,BEATS,FAIRY,travel,ring};
W.cam=W.px-VW/2;hud();requestAnimationFrame(frame);
if(!S.landed)intro();
</script>
</body>
</html>
