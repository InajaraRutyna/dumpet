<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Dumpet på Måne Syv</title>
<style>
:root{color-scheme:dark;--ink:#e9edf8;--dim:#a79fd0;--gold:#ffd76a;--teal:#9ff3e0;--red:#ff8a8a;--black:#05040c;--panel:rgba(5,4,12,.92);--line:#3a2a5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--black);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.4;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:12px;align-items:flex-start;font:700 10px Verdana,sans-serif;letter-spacing:.1em;text-shadow:0 1px 3px #000}
#hud>div{flex:1}#hud .bar{height:5px;background:rgba(233,237,248,.2);border-radius:3px;margin-top:4px;overflow:hidden}#hud .bar i{display:block;height:100%;transition:width .5s}
#menu{flex:none;width:38px;height:38px;min-height:0;padding:0;text-align:center;border-radius:50%;font-size:16px;background:rgba(5,4,12,.4)}
#pad{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
#pad button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1.5px solid rgba(233,237,248,.3);background:rgba(5,4,12,.35);font-size:22px;text-align:center;padding:0;min-height:0}
#pad div{display:flex;gap:10px}
#app{position:fixed;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;background:var(--panel);border-top:1px solid rgba(255,215,106,.6);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
#app.full{max-height:100%;top:0;border-radius:0;border:0;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#app>*{flex-shrink:0}
h1{font-size:2rem;line-height:1.05;margin:0;color:var(--gold);font-weight:400}
h2{font-size:1.3rem;margin:0;font-weight:400;color:var(--gold)}
p{margin:0}
.lab{font:700 .66rem Verdana,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim);font-size:.86rem}
.nar{color:var(--dim);font-style:italic}
.you{font-style:italic}.you:before{content:"You think: ";color:var(--dim)}
.ali{font:.82rem ui-monospace,Menlo,monospace;color:var(--teal)}
.dk{font-size:1.25rem}.dk b{font-weight:400;color:var(--gold);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;display:block}
.mine{font-size:1.15rem;color:var(--teal)}.mine b{font-weight:400;color:var(--dim);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;display:block}
.w{border-bottom:1px dotted var(--dim)}
.fg{color:#6a6f96;border-bottom:1px dotted #6a6f96}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.opts{display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:var(--ink);background:rgba(58,42,94,.45);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:46px;text-align:left;touch-action:manipulation}
button small{display:block;color:var(--dim);font:.76rem Verdana,sans-serif}
button.go{background:var(--gold);color:#221a05;border-color:var(--gold);font-weight:700;text-align:center}
button.ghost{background:transparent;text-align:center}
button.mini{min-height:0;padding:1px 8px;font-size:.75rem;border-radius:8px;display:inline;vertical-align:middle}
button:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:44px}
.chip{min-height:40px;padding:6px 12px;border-radius:20px;border-color:rgba(159,243,224,.5);background:rgba(159,243,224,.08);text-align:center}
.chip.new{border-color:var(--gold);box-shadow:0 0 10px rgba(255,215,106,.5)}
.slot{border:1px dashed var(--line);border-radius:14px;padding:6px;background:rgba(0,0,0,.3)}
.meter{height:10px;background:#1a1238;border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}
input[type=text]{font:inherit;color:var(--ink);background:#120e26;border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;user-select:text;-webkit-user-select:text}
#tip{position:fixed;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));max-width:88%;padding:8px 16px;border-radius:20px;background:var(--gold);color:#221a05;font-weight:700;text-align:center;z-index:9}
.pop{animation:pop .3s}@keyframes pop{from{opacity:.1;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
[hidden]{display:none!important}
</style>

<body>
<canvas id="cv"></canvas>
<div id="hud"><div>FORSTAND<div class="bar"><i id="fo" style="background:var(--gold)"></i></div></div><div id="tl">TILLID<div class="bar"><i id="ti" style="background:var(--teal)"></i></div></div><button id="menu" aria-label="menu">☰</button></div>
<div id="pad"><div><button id="bl" aria-label="walk left">◀</button><button id="br" aria-label="walk right">▶</button></div><button id="bj" aria-label="jump">▲</button></div>
<div id="app" hidden></div>

<script>
"use strict";
/* ============================================================
   DUMPET PÅ MÅNE SYV — a dark fairy-tale side-scroller for
   learning Danish. Original story, characters, art and sound.
   Sections: words · state · sound · world art · talking · story.
   ============================================================ */

// ---------- WORDS: every Danish word used, with its meaning ----------
const GLOSS={hov:"hey!",hvad:"what",laver:"are (you) doing",du:"you",i:"in",min:"my",sø:"lake",er:"am / are / is",okay:"okay",godt:"good",men:"but",helt:"completely",våd:"wet",nej:"no",ja:"yes",stakkels:"poor (you)",dig:"you (object)",og:"and",se:"look",ordene:"the words",flyver:"are flying",fang:"catch",dem:"them",først:"first",jeg:"I",hedder:"am called",velkommen:"welcome",til:"to",måne:"moon",syv:"seven",hvor:"where",kommer:"come",fra:"from",nå:"oh!",kom:"came / come!",med:"with / by",et:"a",en:"a",rumskib:"spaceship",sig:"say",det:"it / that",selv:"yourself",de:"they",smider:"throw",altid:"always",ting:"things",vi:"we",går:"walk / go",tågeby:"Fog Town",der:"there",varmt:"warm",tørt:"dry",uha:"yikes",her:"here",mørkt:"dark",mørk:"dark",lygterne:"the lanterns",lygte:"lantern",sover:"are asleep",lys:"light",den:"this one / it",lidt:"a little",sur:"grumpy",prøv:"try",at:"to",sige:"say",tak:"thanks / please",endnu:"yet another",fremmed:"stranger",hvorfor:"why",hertil:"(to) here",hun:"she",på:"on (på grund af = because of)",grund:"reason (på grund af = because of)",af:"of",selvfølgelig:"of course",falder:"fall",ned:"down",himlen:"the sky",hele:"hele tiden = all the time",tiden:"hele tiden = all the time",så:"so",søen:"the lake",mener:"mean",ha:"ha",kan:"can",tale:"speak",næsten:"almost",pas:"pas på = watch out",ved:"by / near",broen:"the bridge",bro:"bridge",bor:"lives",trold:"troll",han:"he",stiller:"stiller spørgsmål = asks questions",spørgsmål:"questions",stop:"stop",ingen:"nobody",over:"across",uden:"without",god:"good",langsomt:"slowly",for:"too",hel:"whole",sætning:"sentence",én:"one",to:"two",sten:"stone",skoven:"the forest",skov:"forest",nu:"now",ikke:"not",dum:"stupid",som:"as",ser:"ser ud = look / seem",ud:"ser ud = look / seem",rigtigt:"right",gå:"go",bare:"just",hils:"say hello",siger:"are (you) saying",igen:"again",kra:"caw",gav:"made (gav mening = made sense)",mening:"sense",mig:"me",hej:"hi",mumle:"Mumle"};
const BASE="i og er du jeg min ja nej hej tak okay en et det ha kra mumle tågeby stop".split(" ");   // survival words you arrive with
const START=["hej","ja","nej","tak","jeg","du","er","okay"];
// word-lights: [x, height above ground, word]
const FAIRY=[[610,40,"våd"],[760,48,"sø"],[880,112,"måne"],[1250,118,"rumskib"],[1960,44,"mørk"],[2230,110,"lygte"],[2560,46,"skov"],[2880,46,"fremmed"],[2950,84,"hvorfor"],[3030,120,"hertil"],[3900,46,"grund"],[4100,112,"bro"],[4200,48,"trold"]];
const NAMES={m:"Mumle",r:"Ravnen",t:"Trolden",l:"Lygten"};
const VOICE={m:[1,1.5],r:[1.15,1.9],t:[.72,.4],l:[1,1]};

// ---------- STATE ----------
const $=s=>document.querySelector(s),app=$("#app"),tip=$("#tip"),cv=$("#cv"),ctx=cv.getContext("2d");
let S={v:1,beat:0,top:0,px:540,name:"",chips:START.slice(),got:[],peek:[],used:{},fors:8,til:{m:10,r:0,t:0},lit:0,stones:0,landed:0,done:0,sound:1,tilt:0};
try{const o=JSON.parse(localStorage.getItem("dumpet-f1")||"null");if(o&&o.v===1)S=Object.assign(S,o)}catch(e){}
const save=()=>{try{S.px=Math.round(W.px);localStorage.setItem("dumpet-f1",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[.,!?;:"'’…()–-]/g," ").replace(/\s+/g," ").trim();
const knows=w=>BASE.includes(w)||S.chips.includes(w)||S.peek.includes(w)||w===S.name.toLowerCase();
// Danish as you perceive it: words you haven't met are dimmed. Tap any word for its meaning.
const fog=s=>esc(s).split(/([A-Za-zÆØÅæøåé]+)/).map((x,i)=>{if(i%2===0)return x;const l=x.toLowerCase();if(!GLOSS[l])return x;return `<span class="${knows(l)?"w":"fg"}" data-w="${l}">${x}</span>`}).join("");
let tipT;const toast=(t,ms)=>{tip.textContent=t;tip.hidden=false;clearTimeout(tipT);tipT=setTimeout(()=>tip.hidden=true,ms||2600)};
document.addEventListener("click",e=>{audioStart();const w=e.target.closest("[data-w]");if(w){const k=w.dataset.w;toast(w.textContent+" = "+GLOSS[k]);if(w.classList.contains("fg")){w.className="w";if(!S.peek.includes(k))S.peek.push(k)}return}const s=e.target.closest("[data-say]");if(s)speak(s.dataset.say,s.dataset.who)});
function speak(t,who){try{const v=VOICE[who]||[.95,1],u=new SpeechSynthesisUtterance(t);u.lang="da-DK";u.rate=v[0];u.pitch=v[1];const dv=speechSynthesis.getVoices().find(x=>/^da/i.test(x.lang));if(dv)u.voice=dv;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.getVoices()}catch(e){}
function hear(){return new Promise(res=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return res(null);let done=false;const fin=v=>{if(!done){done=true;res(v)}};
 try{const r=new SR();r.lang="da-DK";r.maxAlternatives=4;r.onresult=e=>fin([...e.results[0]].map(a=>a.transcript));r.onerror=e=>fin(e.error==="no-speech"?[]:null);r.onend=()=>fin([]);r.start();setTimeout(()=>{try{r.stop()}catch(e){}},9000)}catch(e){fin(null)}})}
function ui(h,full){app.hidden=false;app.classList.toggle("full",!!full);app.innerHTML=h;app.scrollTop=0;$("#pad").hidden=true}
function closeSheet(){app.hidden=true;app.innerHTML="";$("#pad").hidden=false;W.talk=null}
const sheetOpen=()=>!app.hidden;
function grant(...ws){const fresh=ws.filter(w=>!S.chips.includes(w));S.chips.push(...fresh);W.fresh=fresh;return fresh}
function bump(f,who,t){if(f)S.fors=Math.max(0,Math.min(100,S.fors+f));if(who&&t&&S.til[who]!=null)S.til[who]=Math.max(0,Math.min(30,S.til[who]+t));hud()}
function hud(){$("#fo").style.width=S.fors+"%";const who=W.talk&&S.til[W.talk]!=null?W.talk:"m";$("#tl").firstChild.textContent="TILLID · "+NAMES[who].toUpperCase();$("#ti").style.width=(100*S.til[who]/30)+"%"}

// ---------- SOUND: everything is synthesised here, nothing is recorded ----------
const A={c:null};
function audioStart(){
 if(A.c||!S.sound)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=A.c=new C();
 A.out=c.createGain();A.out.gain.value=.8;A.out.connect(c.destination);
 const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const noise=(type,f,q)=>{const s=c.createBufferSource();s.buffer=b;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(A.out);s.start();return {fl,g}};
 A.wind=noise("bandpass",500,.7);A.water=noise("lowpass",380,.4);A.rumble=noise("lowpass",75,1.2);
 A.dg=c.createGain();A.dg.gain.value=0;const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=520;A.dg.connect(lp);lp.connect(A.out);
 A.osc=[0,1,2].map(i=>{const o=c.createOscillator();o.type=i?"sine":"triangle";o.frequency.value=73.4;o.detune.value=(i-1)*6;o.connect(A.dg);o.start();return o});
 A.nb=0;A.nc=0;A.nk=0;A.no=8;A.ch=0;
}
function tone(f,dur,vol,type,delay,slide){if(!A.c||!S.sound)return;const c=A.c,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(A.out);o.start(t);o.stop(t+dur+.05)}
const sfx={catch:()=>[880,1175,1568].forEach((f,i)=>tone(f,.5,.07,"sine",i*.09)),ok:()=>[392,494,587].forEach(f=>tone(f,1.2,.05,"triangle")),bad:()=>tone(120,.35,.09,"sawtooth",0,70),lamp:()=>[1568,2093,2637,3136].forEach((f,i)=>tone(f,.9,.035,"sine",i*.06)),stone:()=>{tone(55,1.4,.22,"sine",0,38);tone(82,.5,.1,"triangle")},caw:()=>{tone(640,.16,.05,"sawtooth",0,380);tone(600,.2,.05,"sawtooth",.22,340)}};
const CHORDS=[[73.4,110,174.6],[58.3,87.3,138.6],[65.4,98,155.6],[55,82.4,130.8]],BELL=[293.7,349.2,392,440,523.3,587.3,698.5];
function audioTick(t){
 if(!A.c)return;const now=A.c.currentTime,set=(p,v)=>p.setTargetAtTime(S.sound?v:0,now,.6),px=W.px;
 const forest=px>1850&&px<3800,lake=Math.max(0,1-Math.abs(px-420)/700),rav=Math.max(0,1-Math.abs(px-4510)/500);
 set(A.wind.g.gain,(forest?.035:.07)+.03*Math.sin(t*.4));A.wind.fl.frequency.setTargetAtTime(420+260*Math.sin(t*.23)+120*Math.sin(t*.61),now,.5);
 set(A.water.g.gain,.09*lake+.06*rav);set(A.rumble.g.gain,.3*W.trollUp);set(A.dg.gain,.05);
 if(t>A.ch){A.ch=t+13;const ch=CHORDS[Math.floor(t/13)%4];A.osc.forEach((o,i)=>o.frequency.setTargetAtTime(ch[i],now,2))}
 if(t>A.nb){A.nb=t+2.5+Math.random()*4;tone(BELL[Math.floor(Math.random()*BELL.length)]*(forest?.5:1),2.8,.035,"sine")}
 if(forest&&t>A.nk){A.nk=t+.28+Math.random()*.5;if(Math.random()<.6)tone(4100+Math.random()*500,.05,.008,"sine")}
 if(forest&&t>A.no){A.no=t+11+Math.random()*10;tone(370,.5,.03,"sine");tone(311,.7,.03,"sine",.6)}
 if(t>A.nc&&Math.abs(px-3080)<420){A.nc=t+7+Math.random()*8;sfx.caw()}
}

// ---------- WORLD ----------
const W={px:S.px,py:0,vy:0,dir:1,walk:0,cam:0,t:0,L:false,R:false,base:.72,talk:null,busy:false,drop:0,dropT:0,bub:null,trollUp:0,spark:[],pulse:{},len:5300,lastHint:0,fresh:[]};
let VW=360,VH=640,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);W.dk=null}
addEventListener("resize",resize);resize();
let seed=11;const sr=()=>(seed=(seed*16807)%2147483647)/2147483647;
// pre-drawn gnarled trees
function makeTree(sd,col,sc){const c=document.createElement("canvas");c.width=360*sc;c.height=420*sc;const x=c.getContext("2d");let s=sd;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 (function tr(a,b,len,ang,w,d){if(d===0||len<4)return;const bend=(r()-.5)*.9,ex=a+Math.cos(ang)*len,ey=b+Math.sin(ang)*len;x.strokeStyle=col;x.lineWidth=w;x.lineCap="round";x.beginPath();x.moveTo(a,b);x.quadraticCurveTo(a+Math.cos(ang+bend)*len*.5,b+Math.sin(ang+bend)*len*.5,ex,ey);x.stroke();const n=d>4?2:2+(r()>.6?1:0);for(let i=0;i<n;i++)tr(ex,ey,len*(.62+r()*.2),ang+(r()-.5)*1.5,w*.62,d-1)})(180*sc,420*sc,95*sc,-1.57+(r()-.5)*.3,13*sc,7);return c}
const TMID=[3,17,29,41,57].map(s=>makeTree(s,"#0f0d24",.8)),TNEAR=[5,13,23,77,91].map(s=>makeTree(s,"#05040c",1)),TFG=[7,19].map(s=>makeTree(s,"#020208",1.5));
const MIDT=Array.from({length:60},(_,i)=>({x:i*150+sr()*90,k:i%5}));
const NEART=[];for(let x=1820;x<3850;x+=150+sr()*90)NEART.push({x,k:Math.floor(sr()*5)});[980,1500,3990,4960].forEach((x,i)=>NEART.push({x,k:i}));
const FGT=Array.from({length:9},(_,i)=>({x:500+i*900+sr()*300,k:i%2}));
const FIRS=Array.from({length:150},(_,i)=>({x:i*42+sr()*20,h:30+sr()*60}));
const TUFT=Array.from({length:260},()=>({x:470+sr()*4900,h:5+sr()*12}));
const SHROOM=Array.from({length:26},()=>({x:1850+sr()*2000,s:.7+sr()*.9,c:sr()>.5?"232,120,220":"159,243,224"}));
const STARS=Array.from({length:110},()=>({x:sr(),y:sr()*.5,a:.2+sr()*.7}));
const LAMPS=[2080,2400,2720];
const RAV=[4390,4640];   // the ravine under the bridge
const inRav=x=>x>RAV[0]&&x<RAV[1];
const ground=x=>inRav(x)?170:(x<470?10:0)+9*Math.sin(x/190)+5*Math.sin(x/61);
const walkY=x=>inRav(x)?0:ground(x);
// three lights: dusk at the lake, night in the forest, moonlit ravine
const PAL=[{at:0,sky:[[27,16,48],[91,31,74],[200,67,62],[246,160,74]],far:[74,24,56],mist:[255,150,90],water:[168,72,63],orb:[.3,.80,50,255,193,90],stars:.3},
 {at:2100,sky:[[3,3,10],[10,12,30],[20,30,48],[30,60,62]],far:[12,16,34],mist:[90,150,140],water:[30,60,70],orb:[.7,.2,22,214,226,255],stars:.9},
 {at:4300,sky:[[5,4,15],[26,18,56],[58,42,94],[79,122,120]],far:[29,24,56],mist:[140,200,190],water:[47,90,102],orb:[.38,.42,70,233,237,248],stars:1}];
const mix=(a,b,k)=>Array.isArray(a)?a.map((v,i)=>mix(v,b[i],k)):a+(b-a)*k;
function palette(x){let i=0;while(i<PAL.length-2&&x>PAL[i+1].at)i++;const a=PAL[i],b=PAL[i+1],k=Math.max(0,Math.min(1,(x-(b.at-500))/500));const o={};for(const key of ["sky","far","mist","water","orb","stars"])o[key]=mix(a[key],b[key],k);return o}
const rgb=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a==null?1:a})`;
const BLK="#05040c";
function glow(x,y,r,col,a,c){c=c||ctx;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");c.globalAlpha=a==null?1:a;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.globalAlpha=1}
function eyes(x,y,gap,col,r){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x-gap,y,r||2,0,7);ctx.arc(x+gap,y,r||2,0,7);ctx.fill();glow(x,y,12,col,.35)}
function drawHero(x,y,t){
 ctx.save();ctx.translate(x,y);ctx.scale(W.dir,1);const mv=W.walk>.1,ph=t*11,bob=mv?Math.abs(Math.sin(ph))*2.2:Math.sin(t*2)*.8,air=W.py>2;
 glow(19,-84-bob,48,"rgba(255,215,106,.9)",.55+.12*Math.sin(t*5));ctx.fillStyle=BLK;ctx.strokeStyle=BLK;ctx.lineCap="round";ctx.lineWidth=5;

// keep asking until the judge is satisfied; the NPC always answers in fluent Danish
async function converse(o){
 for(let tries=0;;tries++){
  const u=await utter(o),r=u.mode==="late"?(o.late||{who:o.who,da:"For langsomt."}):o.judge(u.text,tries);

  const own=r.ok&&u.mode!=="tap";bump((r.fors||0)+(own?2:0),o.who,r.til||0);
  await new Promise(res=>{ui(`${u.text?`<p class="mine"><b>${esc(S.name||"You")}${u.mode==="voice"?" · spoken":u.mode==="write"?" · written":""}</b>${esc(u.text)}</p>`:""}${npc(r.who||o.who,r.da)}${r.note?`<p class="nar">${esc(r.note)}</p>`:""}${r.think?`<p class="you">${esc(r.think)}</p>`:""}${own?`<p class="dim">+2 Forstand for ${u.mode==="voice"?"saying":"writing"} it yourself.</p>`:""}<button class="go" id="nx">▸</button>`);speak(r.da,r.who||o.who);$("#nx").onclick=res});
  if(r.ok)return r;
 }
}
